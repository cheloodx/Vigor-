<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="100" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="109" x2="58.0" y2="102.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M50,105 Q58.0,102 66,105 
             L101,112 Q95.0,114 89,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M50,105 Q38,90 32,82" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="82" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M66,105 Q48,115 40,122" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="122" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M89,112 Q115,98 138,88" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="88" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M101,112 Q115,128 138,135" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="135" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="118" cy="52" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="118" y1="61" x2="115.0" y2="65.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M107,68 Q115.0,65 123,68 
             L114,105 Q108.0,107 102,105 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M107,68 Q100,58 92,52" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="52" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M123,68 Q132,58 140,52" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="140" cy="52" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,105 Q102,125 98,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="98" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,105 Q122,125 125,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="148" r="3.5" fill="url(#g1)"/>
</svg>