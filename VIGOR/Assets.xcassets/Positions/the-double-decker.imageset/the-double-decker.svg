<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="128" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="48" y1="137" x2="65.0" y2="127.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M57,130 Q65.0,127 73,130 
             L106,132 Q100.0,134 94,132 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M57,130 Q42,118 35,110" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="110" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M73,130 Q48,140 40,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,132 Q120,118 142,108" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="108" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,132 Q120,145 142,152" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="152" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="55" cy="82" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="55" y1="91" x2="70.0" y2="85.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M62,88 Q70.0,85 78,88 
             L111,98 Q105.0,100 99,98 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M62,88 Q50,72 42,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M78,88 Q58,98 48,105" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="105" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M99,98 Q125,85 145,78" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="78" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M111,98 Q125,110 145,118" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="118" r="3.5" fill="url(#g1)"/>
</svg>