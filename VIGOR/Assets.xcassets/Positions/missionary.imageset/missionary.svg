<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="135" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="55" y1="144" x2="72.0" y2="127.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M64,130 Q72.0,127 80,130 
             L118,132 Q112.0,134 106,132 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M64,130 Q58,115 48,108" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="108" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M80,130 Q58,148 48,156" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="156" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M106,132 Q132,112 152,102" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="152" cy="102" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M118,132 Q132,152 152,158" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="152" cy="158" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="62" cy="110" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="62" y1="119" x2="78.0" y2="112.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M70,115 Q78.0,112 86,115 
             L118,115 Q112.0,117 106,115 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M70,115 Q68,98 56,92" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="56" cy="92" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M86,115 Q90,98 100,90" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="90" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M106,115 Q132,98 148,88" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="148" cy="88" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M118,115 Q132,132 148,140" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="148" cy="140" r="3.5" fill="url(#g1)"/>
</svg>