<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="82" cy="52" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="82" y1="61" x2="82.0" y2="65.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M74,68 Q82.0,65 90,68 
             L91,102 Q85.0,104 79,102 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M74,68 Q62,72 52,82" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="82" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M90,68 Q102,68 112,75" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="112" cy="75" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M79,102 Q72,122 65,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="145" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M91,102 Q98,122 105,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="145" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="118" cy="55" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="118" y1="64" x2="115.0" y2="69.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M107,72 Q115.0,69 123,72 
             L114,105 Q108.0,107 102,105 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M107,72 Q98,78 90,85" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="85" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M123,72 Q135,78 142,85" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="142" cy="85" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,105 Q98,125 88,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,105 Q122,125 132,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="148" r="3.5" fill="url(#g2)"/>
</svg>