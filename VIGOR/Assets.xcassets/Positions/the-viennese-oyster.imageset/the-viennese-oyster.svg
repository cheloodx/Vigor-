<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="98" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="55" y1="107" x2="70.0" y2="99.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M62,102 Q70.0,99 78,102 
             L108,112 Q102.0,114 96,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M62,102 Q50,88 42,80" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="80" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M78,102 Q52,112 42,118" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="118" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M96,112 Q85,78 68,68" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="68" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M108,112 Q108,80 115,68" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="115" cy="68" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="125" cy="62" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="125" y1="71" x2="122.0" y2="75.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M114,78 Q122.0,75 130,78 
             L118,108 Q112.0,110 106,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M114,78 Q108,65 100,58" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="58" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M130,78 Q142,65 150,58" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="58" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M106,108 Q105,128 100,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M118,108 Q128,128 132,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="150" r="3.5" fill="url(#g1)"/>
</svg>