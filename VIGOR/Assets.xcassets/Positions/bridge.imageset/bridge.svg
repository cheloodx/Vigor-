<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="52" cy="128" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="52" y1="137" x2="68.0" y2="115.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M60,118 Q68.0,115 76,118 
             L111,108 Q105.0,110 99,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M60,118 Q48,138 42,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M76,118 Q42,122 35,128" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="128" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M99,108 Q128,122 145,138" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="138" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M111,108 Q118,138 130,152" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="152" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="108" cy="72" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="108" y1="81" x2="108.0" y2="85.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M100,88 Q108.0,85 116,88 
             L114,105 Q108.0,107 102,105 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M100,88 Q88,82 80,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="80" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M116,88 Q128,82 135,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="135" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,105 Q92,118 85,135" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="85" cy="135" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,105 Q122,118 128,135" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="135" r="3.5" fill="url(#g1)"/>
</svg>