<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="100" cy="140" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="100" y1="149" x2="100.0" y2="149.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M92,152 Q100.0,149 108,152 
             L106,168 Q100.0,170 94,168 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M92,152 Q78,150 65,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="65" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M108,152 Q122,150 135,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="135" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,168 Q82,172 68,168" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="168" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,168 Q118,172 132,168" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="168" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="100" cy="78" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="100" y1="87" x2="100.0" y2="87.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M92,90 Q100.0,87 108,90 
             L106,120 Q100.0,122 94,120 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M92,90 Q80,95 72,105" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="105" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M108,90 Q120,95 128,105" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="128" cy="105" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M94,120 Q82,135 75,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="155" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M106,120 Q118,135 125,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="155" r="3.5" fill="url(#g1)"/>
</svg>