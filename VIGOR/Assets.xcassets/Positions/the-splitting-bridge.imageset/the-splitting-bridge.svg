<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="128" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="48" y1="137" x2="62.0" y2="115.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M54,118 Q62.0,115 70,118 
             L101,108 Q95.0,110 89,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M54,118 Q42,138 35,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M70,118 Q38,118 30,112" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="30" cy="112" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M89,108 Q115,88 135,72" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="72" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M101,108 Q115,128 135,140" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="140" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="118" cy="65" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="118" y1="74" x2="115.0" y2="79.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M107,82 Q115.0,79 123,82 
             L114,108 Q108.0,110 102,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M107,82 Q98,72 92,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M123,82 Q132,72 138,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="138" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,108 Q102,128 98,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="98" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,108 Q122,128 125,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="148" r="3.5" fill="url(#g1)"/>
</svg>