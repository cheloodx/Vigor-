<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="95" cy="52" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="95" y1="61" x2="95.0" y2="65.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M87,68 Q95.0,65 103,68 
             L101,102 Q95.0,104 89,102 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M87,68 Q75,78 68,92" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="68" cy="92" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M103,68 Q115,78 122,92" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="122" cy="92" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M89,102 Q78,118 72,138" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="138" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M101,102 Q112,118 118,138" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="118" cy="138" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="105" cy="52" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="105" y1="61" x2="105.0" y2="65.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M97,68 Q105.0,65 113,68 
             L111,98 Q105.0,100 99,98 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M97,68 Q85,82 78,95" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="78" cy="95" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M113,68 Q125,82 132,95" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="132" cy="95" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M99,98 Q88,118 82,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="145" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M111,98 Q122,118 128,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="145" r="3.5" fill="url(#g1)"/>
</svg>