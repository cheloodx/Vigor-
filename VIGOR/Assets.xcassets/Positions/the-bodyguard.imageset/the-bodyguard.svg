<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="88" cy="38" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="88" y1="47" x2="88.0" y2="52.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M80,55 Q88.0,52 96,55 
             L94,92 Q88.0,94 82,92 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M80,55 Q68,62 58,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="58" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M96,55 Q108,58 118,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="118" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M82,92 Q80,118 78,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="78" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M94,92 Q98,118 100,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="150" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="112" cy="38" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="112" y1="47" x2="112.0" y2="52.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M104,55 Q112.0,52 120,55 
             L118,92 Q112.0,94 106,92 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M104,55 Q92,65 82,75" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="82" cy="75" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M120,55 Q132,62 142,72" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="142" cy="72" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M106,92 Q105,118 102,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="102" cy="150" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M118,92 Q122,118 125,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="150" r="3.5" fill="url(#g2)"/>
</svg>