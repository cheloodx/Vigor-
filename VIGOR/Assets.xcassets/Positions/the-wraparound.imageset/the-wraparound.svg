<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="78" cy="42" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="78" y1="51" x2="78.0" y2="55.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M70,58 Q78.0,55 86,58 
             L88,95 Q82.0,97 76,95 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M70,58 Q58,62 52,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M86,58 Q98,55 108,48" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="108" cy="48" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M76,95 Q72,118 65,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="145" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M88,95 Q98,112 115,128" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="115" cy="128" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="118" cy="42" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="118" y1="51" x2="118.0" y2="55.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M110,58 Q118.0,55 126,58 
             L121,95 Q115.0,97 109,95 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M110,58 Q98,55 90,48" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="48" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M126,58 Q138,62 148,72" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="72" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M109,95 Q105,118 92,135" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="92" cy="135" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M121,95 Q128,118 135,145" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="145" r="3.5" fill="url(#g2)"/>
</svg>