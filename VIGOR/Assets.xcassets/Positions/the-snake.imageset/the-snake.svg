<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="112" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="121" x2="60.0" y2="115.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M52,118 Q60.0,115 68,118 
             L106,122 Q100.0,124 94,122 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M52,118 Q38,125 32,135" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="135" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M68,118 Q52,128 48,138" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="138" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,122 Q120,135 142,142" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="142" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,122 Q115,140 135,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="148" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="65" cy="88" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="65" y1="97" x2="78.0" y2="92.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M70,95 Q78.0,92 86,95 
             L114,105 Q108.0,107 102,105 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M70,95 Q60,78 52,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M86,95 Q85,78 90,70" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="90" cy="70" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,105 Q128,118 148,125" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="148" cy="125" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,105 Q122,125 140,132" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="132" r="3.5" fill="url(#g1)"/>
</svg>