<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="118" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="48" y1="127" x2="65.0" y2="117.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M57,120 Q65.0,117 73,120 
             L106,122 Q100.0,124 94,122 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M57,120 Q42,108 35,100" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="100" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M73,120 Q48,130 40,138" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="138" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,122 Q120,110 142,100" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="100" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,122 Q120,135 142,142" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="142" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="108" cy="78" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="108" y1="87" x2="108.0" y2="89.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M100,92 Q108.0,89 116,92 
             L114,118 Q108.0,120 102,118 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M100,92 Q88,88 80,82" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="80" cy="82" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M116,92 Q128,88 135,82" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="135" cy="82" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,118 Q95,135 88,152" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="152" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,118 Q122,135 128,152" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="152" r="3.5" fill="url(#g1)"/>
</svg>