<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="52" cy="115" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="52" y1="124" x2="68.0" y2="115.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M60,118 Q68.0,115 76,118 
             L106,122 Q100.0,124 94,122 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M60,118 Q48,105 42,98" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="98" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M76,118 Q50,128 42,135" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="135" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,122 Q118,88 132,68" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="68" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,122 Q125,95 142,75" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="75" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="130" cy="52" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="130" y1="61" x2="128.0" y2="65.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M120,68 Q128.0,65 136,68 
             L124,108 Q118.0,110 112,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M120,68 Q112,58 105,52" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="105" cy="52" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M136,68 Q145,58 152,52" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="152" cy="52" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M112,108 Q112,128 108,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M124,108 Q132,128 135,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="150" r="3.5" fill="url(#g1)"/>
</svg>