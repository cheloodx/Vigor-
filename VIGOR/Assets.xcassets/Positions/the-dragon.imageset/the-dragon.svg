<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="115" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="124" x2="58.0" y2="115.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M50,118 Q58.0,115 66,118 
             L104,120 Q98.0,122 92,120 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M50,118 Q38,128 32,138" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="138" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M66,118 Q52,128 48,140" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="140" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M92,120 Q118,132 138,140" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="140" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M104,120 Q115,138 132,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="148" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="108" cy="78" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="108" y1="87" x2="108.0" y2="89.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M100,92 Q108.0,89 116,92 
             L111,115 Q105.0,117 99,115 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M100,92 Q90,85 82,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="82" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M116,92 Q128,85 135,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="135" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M99,115 Q95,132 88,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M111,115 Q118,132 125,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="150" r="3.5" fill="url(#g1)"/>
</svg>