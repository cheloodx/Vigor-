<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="78" cy="42" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="78" y1="51" x2="78.0" y2="55.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M70,58 Q78.0,55 86,58 
             L84,98 Q78.0,100 72,98 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M70,58 Q58,72 52,88" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="88" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M86,58 Q92,68 98,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M72,98 Q72,125 68,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="158" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M84,98 Q85,125 88,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="158" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="122" cy="42" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="122" y1="51" x2="122.0" y2="55.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M114,58 Q122.0,55 130,58 
             L124,98 Q118.0,100 112,98 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M114,58 Q105,68 98,78" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="78" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M130,58 Q140,72 148,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M112,98 Q112,125 108,158" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="158" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M124,98 Q128,125 132,158" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="158" r="3.5" fill="url(#g2)"/>
</svg>