<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="100" cy="48" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="100" y1="57" x2="100.0" y2="59.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M92,62 Q100.0,59 108,62 
             L106,95 Q100.0,97 94,95 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M92,62 Q78,72 68,82" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="68" cy="82" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M108,62 Q122,72 132,82" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="132" cy="82" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M94,95 Q78,112 72,132" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="132" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M106,95 Q122,112 128,132" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="132" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="100" cy="118" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="100" y1="127" x2="100.0" y2="127.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M92,130 Q100.0,127 108,130 
             L106,148 Q100.0,150 94,148 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M92,130 Q82,135 72,140" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="72" cy="140" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M108,130 Q118,135 128,140" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="128" cy="140" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,148 Q82,155 72,162" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="162" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,148 Q118,155 128,162" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="162" r="3.5" fill="url(#g2)"/>
</svg>