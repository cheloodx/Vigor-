<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="72" cy="62" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="72" y1="71" x2="72.0" y2="75.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M64,78 Q72.0,75 80,78 
             L78,108 Q72.0,110 66,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M64,78 Q52,85 45,95" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="95" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M80,78 Q92,82 100,92" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="92" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M66,108 Q65,128 58,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="58" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M78,108 Q82,128 88,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="148" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="128" cy="55" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="128" y1="64" x2="128.0" y2="69.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M120,72 Q128.0,69 136,72 
             L131,105 Q125.0,107 119,105 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M120,72 Q112,78 105,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="105" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M136,72 Q148,78 155,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="155" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M119,105 Q115,125 108,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M131,105 Q135,125 140,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="140" cy="148" r="3.5" fill="url(#g2)"/>
</svg>