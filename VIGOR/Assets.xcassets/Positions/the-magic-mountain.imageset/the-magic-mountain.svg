<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="72" cy="62" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="72" y1="71" x2="75.0" y2="75.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M67,78 Q75.0,75 83,78 
             L86,112 Q80.0,114 74,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M67,78 Q55,85 48,98" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="98" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M83,78 Q95,82 100,95" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="95" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M74,112 Q65,132 55,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="150" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M86,112 Q95,132 105,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="150" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="105" cy="55" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="105" y1="64" x2="105.0" y2="69.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M97,72 Q105.0,69 113,72 
             L108,108 Q102.0,110 96,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M97,72 Q85,78 78,88" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="78" cy="88" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M113,72 Q125,78 132,88" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="132" cy="88" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M96,108 Q88,128 78,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="78" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M108,108 Q118,128 128,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="148" r="3.5" fill="url(#g1)"/>
</svg>