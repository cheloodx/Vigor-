<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="88" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="55" y1="97" x2="68.0" y2="92.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M60,95 Q68.0,92 76,95 
             L98,112 Q92.0,114 86,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M60,95 Q48,78 38,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="38" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M76,95 Q55,105 42,112" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="112" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M86,112 Q105,130 118,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="118" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M98,112 Q78,132 65,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="148" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="145" cy="88" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="145" y1="97" x2="132.0" y2="92.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M124,95 Q132.0,92 140,95 
             L114,112 Q108.0,114 102,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M124,95 Q152,78 162,65" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="162" cy="65" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M140,95 Q145,105 158,112" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="112" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,112 Q95,130 82,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,112 Q122,132 135,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="148" r="3.5" fill="url(#g2)"/>
</svg>