<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="88" cy="52" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="88" y1="61" x2="88.0" y2="65.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M80,68 Q88.0,65 96,68 
             L94,105 Q88.0,107 82,105 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M80,68 Q68,78 60,90" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="60" cy="90" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M96,68 Q108,75 118,85" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="118" cy="85" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M82,105 Q65,120 82,130" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="130" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M94,105 Q112,120 95,130" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="130" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="112" cy="52" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="112" y1="61" x2="112.0" y2="65.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M104,68 Q112.0,65 120,68 
             L118,102 Q112.0,104 106,102 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M104,68 Q92,75 82,85" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="82" cy="85" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M120,68 Q132,78 140,90" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="140" cy="90" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M106,102 Q92,118 108,128" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="128" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M118,102 Q135,118 118,130" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="118" cy="130" r="3.5" fill="url(#g2)"/>
</svg>