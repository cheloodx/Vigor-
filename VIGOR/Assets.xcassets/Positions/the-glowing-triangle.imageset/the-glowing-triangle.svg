<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="62" cy="68" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="62" y1="77" x2="68.0" y2="79.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M60,82 Q68.0,79 76,82 
             L88,112 Q82.0,114 76,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M60,82 Q48,88 40,98" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="98" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M76,82 Q82,78 92,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="92" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M76,112 Q68,132 55,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M88,112 Q98,128 112,140" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="140" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="138" cy="68" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="138" y1="77" x2="132.0" y2="79.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M124,82 Q132.0,79 140,82 
             L124,112 Q118.0,114 112,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M124,82 Q118,78 108,72" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="108" cy="72" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M140,82 Q152,88 160,98" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="160" cy="98" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M112,112 Q105,128 92,142" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="92" cy="142" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M124,112 Q132,132 142,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="150" r="3.5" fill="url(#g2)"/>
</svg>