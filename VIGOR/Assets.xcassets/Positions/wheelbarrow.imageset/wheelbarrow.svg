<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="108" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="117" x2="58.0" y2="102.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M50,105 Q58.0,102 66,105 
             L101,100 Q95.0,102 89,100 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M50,105 Q42,128 35,142" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="142" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M66,105 Q52,128 48,142" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="142" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M89,100 Q112,82 128,72" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="72" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M101,100 Q112,118 128,125" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="125" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="142" cy="62" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="142" y1="71" x2="138.0" y2="75.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M130,78 Q138.0,75 146,78 
             L131,100 Q125.0,102 119,100 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M130,78 Q128,105 120,112" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="120" cy="112" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M146,78 Q152,105 158,112" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="112" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M119,100 Q128,122 125,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="145" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M131,100 Q140,122 142,145" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="145" r="3.5" fill="url(#g1)"/>
</svg>