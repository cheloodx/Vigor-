<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="105" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="48" y1="114" x2="62.0" y2="105.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M54,108 Q62.0,105 70,108 
             L101,118 Q95.0,120 89,118 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M54,108 Q42,95 35,88" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="88" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M70,108 Q52,118 42,125" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="125" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M89,118 Q112,128 130,138" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="138" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M101,118 Q85,135 72,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="148" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="138" cy="82" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="138" y1="91" x2="128.0" y2="89.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M120,92 Q128.0,89 136,92 
             L114,115 Q108.0,117 102,115 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M120,92 Q142,72 148,62" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="62" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M136,92 Q138,98 148,105" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="105" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,115 Q98,132 88,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="150" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,115 Q118,132 125,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="150" r="3.5" fill="url(#g2)"/>
</svg>