<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="82" cy="35" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="82" y1="44" x2="82.0" y2="49.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M74,52 Q82.0,49 90,52 
             L88,88 Q82.0,90 76,88 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M74,52 Q62,62 55,75" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="55" cy="75" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M90,52 Q98,58 108,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="108" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M76,88 Q75,115 72,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M88,88 Q92,115 95,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="95" cy="148" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="118" cy="38" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="118" y1="47" x2="118.0" y2="52.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M110,55 Q118.0,52 126,55 
             L121,92 Q115.0,94 109,92 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M110,55 Q102,62 95,72" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="95" cy="72" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M126,55 Q138,58 145,68" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="145" cy="68" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M109,92 Q108,118 105,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="150" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M121,92 Q128,118 130,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="150" r="3.5" fill="url(#g2)"/>
</svg>