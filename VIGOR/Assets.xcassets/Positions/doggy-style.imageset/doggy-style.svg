<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="45" cy="100" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="45" y1="109" x2="62.0" y2="105.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M54,108 Q62.0,105 70,108 
             L106,112 Q100.0,114 94,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M54,108 Q48,128 42,145" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="145" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M70,108 Q58,130 52,145" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="145" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,112 Q112,130 118,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="118" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,112 Q98,130 92,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="92" cy="148" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="135" cy="78" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="135" y1="87" x2="128.0" y2="89.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M120,92 Q128.0,89 136,92 
             L118,112 Q112.0,114 106,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M120,92 Q118,78 108,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="108" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M136,92 Q140,78 150,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M106,112 Q122,132 128,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M118,112 Q108,130 102,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="102" cy="148" r="3.5" fill="url(#g1)"/>
</svg>