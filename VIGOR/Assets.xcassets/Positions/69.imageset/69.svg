<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="102" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="48" y1="111" x2="65.0" y2="105.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M57,108 Q65.0,105 73,108 
             L114,112 Q108.0,114 102,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M57,108 Q42,118 35,125" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="35" cy="125" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M73,108 Q58,92 52,85" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="52" cy="85" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M102,112 Q128,95 150,88" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="88" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M114,112 Q128,128 150,132" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="150" cy="132" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="152" cy="118" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="152" y1="127" x2="135.0" y2="109.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M127,112 Q135.0,109 143,112 
             L98,108 Q92.0,110 86,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M127,112 Q158,102 165,95" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="165" cy="95" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M143,112 Q142,128 148,135" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="135" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M86,108 Q72,125 50,132" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="132" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M98,108 Q72,92 50,88" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="88" r="3.5" fill="url(#g2)"/>
</svg>