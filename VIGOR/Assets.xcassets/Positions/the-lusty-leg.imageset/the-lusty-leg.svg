<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="75" cy="42" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="75" y1="51" x2="75.0" y2="55.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M67,58 Q75.0,55 83,58 
             L84,95 Q78.0,97 72,95 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M67,58 Q55,65 48,75" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="75" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M83,58 Q95,58 108,52" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="108" cy="52" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M72,95 Q72,122 68,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="68" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M84,95 Q95,75 108,62" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="62" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="125" cy="42" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="125" y1="51" x2="122.0" y2="55.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M114,58 Q122.0,55 130,58 
             L124,95 Q118.0,97 112,95 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M114,58 Q105,62 98,72" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="98" cy="72" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M130,58 Q142,65 148,75" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="75" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M112,95 Q112,122 108,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="108" cy="150" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M124,95 Q130,122 135,150" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="150" r="3.5" fill="url(#g2)"/>
</svg>