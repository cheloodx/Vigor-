<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="98" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="42" y1="107" x2="58.0" y2="99.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M50,102 Q58.0,99 66,102 
             L94,112 Q88.0,114 82,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M50,102 Q38,88 32,78" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="78" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M66,102 Q52,85 48,75" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="75" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M82,112 Q108,128 128,138" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="138" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M94,112 Q105,95 125,85" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="85" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="158" cy="118" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="158" y1="127" x2="142.0" y2="112.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M134,115 Q142.0,112 150,115 
             L118,108 Q112.0,110 106,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M134,115 Q162,108 168,98" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="168" cy="98" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M150,115 Q148,105 152,95" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="152" cy="95" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M106,108 Q92,92 72,82" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="82" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M118,108 Q95,125 75,135" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="135" r="3.5" fill="url(#g2)"/>
</svg>