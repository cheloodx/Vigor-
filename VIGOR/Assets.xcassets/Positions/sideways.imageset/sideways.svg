<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="52" cy="92" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="52" y1="101" x2="65.0" y2="95.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M57,98 Q65.0,95 73,98 
             L101,108 Q95.0,110 89,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M57,98 Q48,82 42,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M73,98 Q72,82 78,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="78" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M89,108 Q115,92 135,82" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="82" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M101,108 Q115,122 135,128" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="128" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="148" cy="108" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="148" y1="117" x2="135.0" y2="109.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M127,112 Q135.0,109 143,112 
             L114,118 Q108.0,120 102,118 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M127,112 Q152,98 158,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="158" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M143,112 Q132,98 125,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="125" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,118 Q92,128 72,135" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="135" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,118 Q92,102 72,95" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="72" cy="95" r="3.5" fill="url(#g2)"/>
</svg>