<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="105" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="55" y1="114" x2="70.0" y2="107.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M62,110 Q70.0,107 78,110 
             L106,118 Q100.0,120 94,118 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M62,110 Q50,95 42,88" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="88" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M78,110 Q55,120 45,125" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="125" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,118 Q125,95 142,105" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="105" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,118 Q125,138 142,130" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="130" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="128" cy="62" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="128" y1="71" x2="125.0" y2="75.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M117,78 Q125.0,75 133,78 
             L121,112 Q115.0,114 109,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M117,78 Q108,68 100,62" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="62" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M133,78 Q142,68 150,62" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="62" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M109,112 Q108,132 105,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="105" cy="155" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M121,112 Q132,132 135,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="155" r="3.5" fill="url(#g1)"/>
</svg>