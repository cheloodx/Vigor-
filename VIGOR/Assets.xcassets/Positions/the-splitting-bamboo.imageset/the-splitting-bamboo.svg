<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="108" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="55" y1="117" x2="70.0" y2="109.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M62,112 Q70.0,109 78,112 
             L106,120 Q100.0,122 94,120 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M62,112 Q50,98 42,90" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="90" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M78,112 Q55,122 45,128" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="128" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,120 Q115,78 130,62" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="62" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,120 Q115,138 130,152" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="130" cy="152" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="135" cy="65" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="135" y1="74" x2="132.0" y2="79.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M124,82 Q132.0,79 140,82 
             L126,115 Q120.0,117 114,115 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M124,82 Q118,72 110,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="110" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M140,82 Q148,72 155,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="155" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M114,115 Q115,135 112,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="112" cy="158" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M126,115 Q135,135 138,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="158" r="3.5" fill="url(#g1)"/>
</svg>