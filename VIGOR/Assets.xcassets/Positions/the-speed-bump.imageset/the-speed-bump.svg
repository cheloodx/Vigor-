<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="128" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="137" x2="58.0" y2="119.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M50,122 Q58.0,119 66,122 
             L101,108 Q95.0,110 89,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M50,122 Q38,138 32,148" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="148" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M66,122 Q52,135 48,145" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="145" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M89,108 Q115,118 135,125" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="125" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M101,108 Q112,125 128,135" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="128" cy="135" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="115" cy="72" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="115" y1="81" x2="112.0" y2="85.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M104,88 Q112.0,85 120,88 
             L111,108 Q105.0,110 99,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M104,88 Q95,78 88,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="88" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M120,88 Q130,78 138,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="138" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M99,108 Q98,128 92,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="92" cy="148" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M111,108 Q118,128 125,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="148" r="3.5" fill="url(#g1)"/>
</svg>