<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="88" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="55" y1="97" x2="70.0" y2="92.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M62,95 Q70.0,92 78,95 
             L106,112 Q100.0,114 94,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M62,95 Q48,78 42,68" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="68" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M78,95 Q62,78 55,68" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="55" cy="68" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M94,112 Q118,128 138,138" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="138" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M106,112 Q88,132 75,148" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="75" cy="148" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="145" cy="88" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="145" y1="97" x2="132.0" y2="95.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M124,98 Q132.0,95 140,98 
             L118,112 Q112.0,114 106,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M124,98 Q148,78 155,68" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="155" cy="68" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M140,98 Q138,78 145,68" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="145" cy="68" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M106,112 Q122,132 138,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M118,112 Q98,128 82,138" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="82" cy="138" r="3.5" fill="url(#g2)"/>
</svg>