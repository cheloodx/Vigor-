<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="62" cy="62" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="62" y1="71" x2="68.0" y2="75.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M60,78 Q68.0,75 76,78 
             L88,112 Q82.0,114 76,112 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M60,78 Q48,82 40,92" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="40" cy="92" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M76,78 Q85,72 95,65" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="95" cy="65" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M76,112 Q68,132 55,150" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="55" cy="150" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M88,112 Q98,128 110,142" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="142" r="3.5" fill="url(#g1)"/>

    <!-- Head -->
    <circle cx="125" cy="62" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="125" y1="71" x2="120.0" y2="75.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M112,78 Q120.0,75 128,78 
             L114,108 Q108.0,110 102,108 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M112,78 Q105,72 95,65" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="95" cy="65" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M128,78 Q140,82 148,92" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="148" cy="92" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,108 Q98,128 88,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="88" cy="148" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,108 Q125,128 135,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="148" r="3.5" fill="url(#g2)"/>
</svg>