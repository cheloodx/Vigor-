<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="42" cy="108" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="42" y1="117" x2="60.0" y2="107.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M52,110 Q60.0,107 68,110 
             L104,112 Q98.0,114 92,112 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M52,110 Q38,98 32,90" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="90" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M68,110 Q48,120 42,128" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="128" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M92,112 Q118,95 135,82" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="82" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M104,112 Q118,128 135,138" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="135" cy="138" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="140" cy="58" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="140" y1="67" x2="138.0" y2="72.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M130,75 Q138.0,72 146,75 
             L136,108 Q130.0,110 124,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M130,75 Q122,68 115,60" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="115" cy="60" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M146,75 Q155,68 160,60" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="160" cy="60" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M124,108 Q125,130 122,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="122" cy="155" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M136,108 Q142,130 145,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="155" r="3.5" fill="url(#g1)"/>
</svg>