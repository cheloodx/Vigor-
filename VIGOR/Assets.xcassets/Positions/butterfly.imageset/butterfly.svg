<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="55" cy="105" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="55" y1="114" x2="72.0" y2="107.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M64,110 Q72.0,107 80,110 
             L114,115 Q108.0,117 102,115 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M64,110 Q55,95 45,90" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="90" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M80,110 Q55,125 45,130" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="45" cy="130" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M102,115 Q128,92 142,80" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="80" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M114,115 Q128,138 142,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="142" cy="148" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="142" cy="58" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="142" y1="67" x2="140.0" y2="72.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M132,75 Q140.0,72 148,75 
             L138,108 Q132.0,110 126,108 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M132,75 Q122,88 115,98" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="115" cy="98" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M148,75 Q155,88 160,98" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="160" cy="98" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M126,108 Q128,132 125,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="125" cy="158" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M138,108 Q142,132 145,158" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="145" cy="158" r="3.5" fill="url(#g1)"/>
</svg>