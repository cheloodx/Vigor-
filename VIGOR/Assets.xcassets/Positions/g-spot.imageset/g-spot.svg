<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
<defs>
<linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#FFB0C8;stop-opacity:1" />
<stop offset="100%" style="stop-color:#FF7BA3;stop-opacity:1" />
</linearGradient>
<linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" style="stop-color:#E8608A;stop-opacity:1" />
<stop offset="100%" style="stop-color:#C44569;stop-opacity:1" />
</linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#FF6B8A;stop-opacity:0.15" />
<stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:0" />
</radialGradient>
</defs>
<rect width="200" height="200" fill="#12122a" rx="20"/>
<circle cx="100" cy="100" r="80" fill="url(#glow)"/>

    <!-- Head -->
    <circle cx="48" cy="112" r="11" fill="url(#g2)" />
    <!-- Neck -->
    <line x1="48" y1="121" x2="65.0" y2="112.0" stroke="url(#g2)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M57,115 Q65.0,112 73,115 
             L106,120 Q100.0,122 94,120 Z" 
          fill="url(#g2)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M57,115 Q45,102 38,95" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="38" cy="95" r="3.0" fill="url(#g2)"/>
    <!-- Right arm -->
    <path d="M73,115 Q50,128 42,135" fill="none" stroke="url(#g2)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="42" cy="135" r="3.0" fill="url(#g2)"/>
    <!-- Left leg -->
    <path d="M94,120 Q120,102 138,90" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="90" r="3.5" fill="url(#g2)"/>
    <!-- Right leg -->
    <path d="M106,120 Q120,138 138,148" fill="none" stroke="url(#g2)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="138" cy="148" r="3.5" fill="url(#g2)"/>

    <!-- Head -->
    <circle cx="128" cy="72" r="11" fill="url(#g1)" />
    <!-- Neck -->
    <line x1="128" y1="81" x2="125.0" y2="85.0" stroke="url(#g1)" stroke-width="6" stroke-linecap="round"/>
    <!-- Torso (filled shape) -->
    <path d="M117,88 Q125.0,85 133,88 
             L121,115 Q115.0,117 109,115 Z" 
          fill="url(#g1)" opacity="0.95"/>
    <!-- Left arm -->
    <path d="M117,88 Q112,78 105,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="105" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Right arm -->
    <path d="M133,88 Q142,80 150,72" fill="none" stroke="url(#g1)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="150" cy="72" r="3.0" fill="url(#g1)"/>
    <!-- Left leg -->
    <path d="M109,115 Q108,135 102,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="102" cy="155" r="3.5" fill="url(#g1)"/>
    <!-- Right leg -->
    <path d="M121,115 Q128,135 132,155" fill="none" stroke="url(#g1)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="132" cy="155" r="3.5" fill="url(#g1)"/>
</svg>