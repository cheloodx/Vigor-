<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SatConnect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1c;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 500px;
            text-align: center;
        }
        h1 { font-size: 36px; color: #ffffff; margin-bottom: 12px; }
        .accent { color: #00d4aa; }
        p { color: #8899aa; margin-bottom: 32px; font-size: 16px; }
        a {
            display: block;
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            color: #00d4aa;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            margin-bottom: 12px;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover { background: rgba(0, 212, 170, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sat<span class="accent">Connect</span></h1>
        <p>Instant eSIM for 50+ Countries</p>
        <a href="./privacy/">Privacy Policy</a>
        <a href="./support/">Support Center</a>
    </div>
</body>
</html>
