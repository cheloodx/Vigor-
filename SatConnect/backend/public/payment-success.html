<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatConnect - Plata Reusita</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #06b6d4;
      --bg-dark: #0f0f23;
      --bg-card: #161632;
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    /* Background */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 50%);
    }

    .container {
      max-width: 520px;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    /* Nav mini */
    .nav-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .nav-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .nav-name {
      font-size: 1rem;
      font-weight: 700;
    }
    .nav-name span { color: var(--primary-light); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      text-align: center;
    }

    /* Status icon */
    .status-icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-icon.success {
      background: rgba(16,185,129,0.12);
      border: 2px solid rgba(16,185,129,0.3);
    }
    .status-icon.success svg { color: var(--success); }
    .status-icon.loading {
      background: rgba(99,102,241,0.1);
      border: 2px solid rgba(99,102,241,0.2);
    }
    .status-icon.error {
      background: rgba(239,68,68,0.1);
      border: 2px solid rgba(239,68,68,0.2);
    }
    .status-icon.error svg { color: var(--danger); }
    .status-icon svg { width: 28px; height: 28px; }

    .spinner {
      width: 28px; height: 28px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary-light);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

    /* eSIM Details */
    .esim-details { text-align: left; margin-top: 20px; }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: var(--text-dim); font-size: 0.82rem; font-weight: 500; }
    .detail-value {
      font-weight: 600;
      font-size: 0.88rem;
      text-align: right;
      max-width: 60%;
      word-break: break-all;
    }

    /* QR Code */
    .qr-section {
      margin-top: 24px;
      padding: 24px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      text-align: center;
    }
    .qr-section h3 {
      margin-bottom: 16px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .qr-section img {
      width: 180px; height: 180px;
      border-radius: var(--radius-md);
      background: #fff;
      padding: 8px;
    }
    .qr-instruction {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Apple Install Button */
    .apple-install-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .apple-install-btn:hover {
      background: #4f46e5;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
      transform: translateY(-1px);
    }
    .apple-install-btn svg { width: 18px; height: 18px; }

    /* LPA Section */
    .lpa-section {
      margin-top: 20px;
      padding: 16px;
      background: rgba(99,102,241,0.05);
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: var(--radius-md);
    }
    .lpa-section h4 {
      font-size: 0.82rem;
      margin-bottom: 8px;
      color: var(--primary-light);
      font-weight: 600;
    }
    .lpa-code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      word-break: break-all;
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }
    .lpa-code:hover { background: rgba(0,0,0,0.5); }

    .copied-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(16,185,129,0.3);
    }
    .copied-toast.show { display: block; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      color: var(--primary-light);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }
    .back-link svg { width: 16px; height: 16px; }

    /* Steps */
    .steps {
      text-align: left;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .steps h3 {
      margin-bottom: 14px;
      font-size: 0.88rem;
      font-weight: 600;
    }
    .step {
      display: flex;
      gap: 12px;
      padding: 8px 0;
      align-items: flex-start;
    }
    .step-num {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.2);
      color: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-text {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.5;
      padding-top: 2px;
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="container">
    <div class="nav-mini">
      <div class="nav-logo">S</div>
      <div class="nav-name">Sat<span>Connect</span></div>
    </div>
    <div class="card" id="card">
      <div class="status-icon loading" id="status-icon">
        <div class="spinner"></div>
      </div>
      <h1 id="title">Se proceseaza plata...</h1>
      <p class="subtitle" id="subtitle">Asteapta cateva secunde</p>
      <div id="content"></div>
    </div>
    <div style="text-align:center">
      <a href="/" class="back-link" id="back-link" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Inapoi la magazin
      </a>
    </div>
  </div>
  <div class="copied-toast" id="copied-toast">Copiat in clipboard!</div>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const API_BASE = window.location.origin;
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const planId = params.get('plan_id');

    if (!sessionId) {
      showError('Sesiune invalida', 'Nu s-a gasit ID-ul sesiunii de plata.');
    } else {
      checkPaymentAndProvision();
    }

    // Store Stripe session data for fallback display
    let stripeSessionData = null;

    async function checkPaymentAndProvision() {
      try {
        const stripeRes = await fetch(`${API_BASE}/api/stripe/session/${sessionId}`);
        stripeSessionData = await stripeRes.json();

        if (stripeSessionData.status !== 'paid') {
          showError('Plata nefinalizata', 'Plata nu a fost confirmata inca. Te rugam sa reincerci.');
          return;
        }

        updateStatus('loading', 'Plata confirmata!', 'Se activeaza eSIM-ul tau...');

        let order = await checkOrder();
        if (order && order.status === 'provisioned' && order.iccid) {
          showEsimDetails(order);
          return;
        }

        try {
          const provRes = await fetch(`${API_BASE}/api/orders/provision`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId }),
          });
          const provData = await provRes.json();
          if (provData.success && provData.order) {
            showEsimDetails(provData.order);
            return;
          }
        } catch (e) {
          console.log('Provision call failed, will poll:', e);
        }

        updateStatus('loading', 'Se activeaza eSIM-ul...', 'Poate dura pana la 60 secunde');
        await pollForProvisioning();
      } catch (err) {
        console.error(err);
        showError('Eroare', 'A aparut o eroare. Te rugam sa contactezi suportul.');
      }
    }

    async function checkOrder() {
      try {
        const res = await fetch(`${API_BASE}/api/orders/${sessionId}`);
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    async function pollForProvisioning() {
      const maxAttempts = 15;
      for (let i = 0; i < maxAttempts; i++) {
        await new Promise(r => setTimeout(r, 4000));
        const order = await checkOrder();
        if (order && order.status === 'provisioned' && order.iccid) {
          showEsimDetails(order);
          return;
        }
        if (order && order.status === 'failed') {
          showError('Activare esuata', order.error || 'eSIM-ul nu a putut fi activat. Contacteaza suportul.');
          return;
        }
        const progress = Math.min(90, (i + 1) * 7);
        document.getElementById('subtitle').textContent = `Progres: ${progress}%... Te rugam sa astepti`;
      }
      // Instead of showing error, show payment confirmation with Stripe data as fallback
      showPaymentConfirmedFallback();
    }

    function showPaymentConfirmedFallback() {
      // Payment was confirmed but eSIM provisioning is still processing (webhook handles it)
      // Show success with Stripe session info so user doesn't see scary error
      const sd = stripeSessionData || {};
      const country = escapeHtml(sd.countryName || '');
      const data = escapeHtml(sd.dataLabel || '');
      const amount = sd.amountTotal ? (sd.amountTotal / 100).toFixed(2) : '';
      const curr = escapeHtml((sd.currency || '').toUpperCase());

      updateStatus('success', 'Plata confirmata!', country && data ? `${country} — ${data}` : 'eSIM-ul tau este in curs de activare');

      let html = '<div class="esim-details">';
      if (country) html += `<div class="detail-row"><span class="detail-label">Tara</span><span class="detail-value">${country}</span></div>`;
      if (data) html += `<div class="detail-row"><span class="detail-label">Plan</span><span class="detail-value">${data}</span></div>`;
      if (amount && curr) html += `<div class="detail-row"><span class="detail-label">Suma platita</span><span class="detail-value">${amount} ${curr}</span></div>`;
      html += `<div class="detail-row"><span class="detail-label">Status</span><span class="detail-value" style="color:var(--warning)">Se activeaza...</span></div>`;
      html += '</div>';

      html += `<div style="margin-top:24px; padding:20px; background:rgba(245,158,11,0.08); border:1px solid rgba(245,158,11,0.2); border-radius:var(--radius-md); text-align:center;">
        <p style="color:var(--warning); font-weight:600; margin-bottom:8px;">eSIM-ul se activeaza automat</p>
        <p style="color:var(--text-muted); font-size:0.85rem; line-height:1.5;">Vei primi detaliile eSIM-ului in cateva minute. Poti reveni pe aceasta pagina mai tarziu sau verifica email-ul.</p>
      </div>`;

      document.getElementById('content').innerHTML = html;
      document.getElementById('back-link').style.display = 'inline-flex';

      // Continue polling in background — auto-update if eSIM becomes ready
      pollInBackground();
    }

    async function pollInBackground() {
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 5000));
        const order = await checkOrder();
        if (order && order.status === 'provisioned' && order.iccid) {
          showEsimDetails(order);
          return;
        }
      }
    }

    function showEsimDetails(order) {
      updateStatus('success', 'eSIM Activat!', `${escapeHtml(order.countryName) || ''} ${escapeHtml(order.dataLabel) || ''}`);

      let html = '<div class="esim-details">';
      if (order.iccid) {
        html += `<div class="detail-row"><span class="detail-label">ICCID</span><span class="detail-value">${escapeHtml(order.iccid)}</span></div>`;
      }
      if (order.planId) {
        html += `<div class="detail-row"><span class="detail-label">Plan</span><span class="detail-value">${escapeHtml(order.dataLabel || order.planId)}</span></div>`;
      }
      if (order.countryName) {
        html += `<div class="detail-row"><span class="detail-label">Tara</span><span class="detail-value">${escapeHtml(order.countryName)}</span></div>`;
      }
      html += '</div>';

      if (order.qrcodeUrl) {
        html += `<div class="qr-section"><h3>Scaneaza codul QR</h3><img src="${escapeHtml(order.qrcodeUrl)}" alt="eSIM QR Code" /><p class="qr-instruction">Deschide <strong>Setari &gt; Date mobile &gt; Adauga eSIM</strong> si scaneaza codul QR.</p></div>`;
      }

      if (order.directAppleInstallUrl) {
        html += `<div style="text-align:center; margin-top: 16px;"><a href="${escapeHtml(order.directAppleInstallUrl)}" class="apple-install-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>Instaleaza pe iPhone</a></div>`;
      }

      if (order.lpa) {
        html += `<div class="lpa-section"><h4>Cod de activare (LPA)</h4><div class="lpa-code" data-lpa="${escapeHtml(order.lpa)}">${escapeHtml(order.lpa)}</div></div>`;
      }

      html += `<div class="steps"><h3>Cum se instaleaza:</h3>
        <div class="step"><div class="step-num">1</div><div class="step-text">Deschide <strong>Setari</strong> pe telefon</div></div>
        <div class="step"><div class="step-num">2</div><div class="step-text">Mergi la <strong>Date mobile / Cellular</strong></div></div>
        <div class="step"><div class="step-num">3</div><div class="step-text">Apasa <strong>Adauga eSIM</strong></div></div>
        <div class="step"><div class="step-num">4</div><div class="step-text">Scaneaza codul QR sau introdu codul de activare</div></div>
      </div>`;

      document.getElementById('content').innerHTML = html;
      document.getElementById('back-link').style.display = 'inline-flex';

      const lpaEl = document.querySelector('.lpa-code[data-lpa]');
      if (lpaEl) {
        lpaEl.addEventListener('click', function() { copyLpa(this.getAttribute('data-lpa')); });
      }
    }

    function updateStatus(type, title, subtitle) {
      const icon = document.getElementById('status-icon');
      icon.className = `status-icon ${type}`;
      if (type === 'success') {
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      } else if (type === 'loading') {
        icon.innerHTML = '<div class="spinner"></div>';
      } else {
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      }
      document.getElementById('title').textContent = title;
      document.getElementById('subtitle').textContent = subtitle;
    }

    function showError(title, subtitle) {
      updateStatus('error', title, subtitle);
      document.getElementById('back-link').style.display = 'inline-flex';
    }

    function copyLpa(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copied-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
</html>
