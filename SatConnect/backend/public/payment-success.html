<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatConnect - Plata Reusita</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d3d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 560px;
      width: 100%;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .icon.success { background: rgba(39,174,96,0.2); }
    .icon.loading { background: rgba(0,212,255,0.2); }
    .icon.error { background: rgba(231,76,60,0.2); }
    
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: #8e8ea0; margin-bottom: 24px; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* eSIM Details */
    .esim-details {
      text-align: left;
      margin-top: 24px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-label { color: #8e8ea0; font-size: 0.9rem; }
    .detail-value { font-weight: 600; font-size: 0.95rem; text-align: right; max-width: 60%; word-break: break-all; }

    /* QR Code */
    .qr-section {
      margin-top: 24px;
      padding: 24px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      text-align: center;
    }
    .qr-section h3 { margin-bottom: 16px; font-size: 1.1rem; }
    .qr-section img {
      width: 200px; height: 200px;
      border-radius: 12px;
      background: #fff;
      padding: 8px;
    }
    .qr-instruction {
      color: #8e8ea0;
      font-size: 0.85rem;
      margin-top: 12px;
      line-height: 1.5;
    }

    /* Apple Install Button */
    .apple-install-btn {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #00d4ff, #7b2ff7);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s;
    }
    .apple-install-btn:hover { transform: scale(1.03); box-shadow: 0 8px 30px rgba(123,47,247,0.3); }

    /* LPA Copy */
    .lpa-section {
      margin-top: 20px;
      padding: 16px;
      background: rgba(0,212,255,0.05);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: 12px;
    }
    .lpa-section h4 { font-size: 0.9rem; margin-bottom: 8px; color: #00d4ff; }
    .lpa-code {
      font-family: monospace;
      font-size: 0.8rem;
      word-break: break-all;
      color: #ccc;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }
    .lpa-code:hover { background: rgba(0,0,0,0.5); }
    .lpa-code::after {
      content: 'Click pentru copiere';
      position: absolute;
      top: -24px;
      right: 0;
      font-size: 0.7rem;
      color: #8e8ea0;
    }
    .copied-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #27ae60;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .copied-toast.show { display: block; }

    .back-link {
      display: inline-block;
      margin-top: 24px;
      color: #00d4ff;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .back-link:hover { text-decoration: underline; }

    .status-text { color: #8e8ea0; font-size: 0.9rem; margin-top: 12px; }
    .status-text.provisioning { color: #f39c12; }

    /* Steps */
    .steps {
      text-align: left;
      margin-top: 20px;
    }
    .step {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      align-items: flex-start;
    }
    .step-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: rgba(0,212,255,0.2);
      color: #00d4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-text { color: #ccc; font-size: 0.9rem; line-height: 1.5; padding-top: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card" id="card">
      <div class="icon loading" id="status-icon">
        <div class="spinner"></div>
      </div>
      <h1 id="title">Se proceseaza plata...</h1>
      <p class="subtitle" id="subtitle">Asteapta cateva secunde</p>
      <div id="content"></div>
    </div>
    <div style="text-align:center">
      <a href="/" class="back-link" id="back-link" style="display:none">Inapoi la magazine</a>
    </div>
  </div>
  <div class="copied-toast" id="copied-toast">Copiat!</div>

  <script>
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    const API_BASE = window.location.origin;
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    const planId = params.get('plan_id');

    if (!sessionId) {
      showError('Sesiune invalida', 'Nu s-a gasit ID-ul sesiunii de plata.');
    } else {
      checkPaymentAndProvision();
    }

    async function checkPaymentAndProvision() {
      try {
        // 1. Check Stripe payment status
        const stripeRes = await fetch(`${API_BASE}/api/stripe/session/${sessionId}`);
        const stripeData = await stripeRes.json();

        if (stripeData.status !== 'paid') {
          showError('Plata nefinalizata', 'Plata nu a fost confirmata inca. Te rugam sa reincerci.');
          return;
        }

        // Payment confirmed - show processing
        updateStatus('loading', 'Plata confirmata!', 'Se activeaza eSIM-ul tau...');

        // 2. Check if already provisioned
        let order = await checkOrder();
        if (order && order.status === 'provisioned' && order.iccid) {
          showEsimDetails(order);
          return;
        }

        // 3. Trigger provisioning
        try {
          const provRes = await fetch(`${API_BASE}/api/orders/provision`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId }),
          });
          const provData = await provRes.json();

          if (provData.success && provData.order) {
            showEsimDetails(provData.order);
            return;
          }
        } catch (e) {
          console.log('Provision call failed, will poll:', e);
        }

        // 4. Poll for provisioning completion
        updateStatus('loading', 'Se activeaza eSIM-ul...', 'Poate dura pana la 60 secunde');
        await pollForProvisioning();

      } catch (err) {
        console.error(err);
        showError('Eroare', 'A aparut o eroare. Te rugam sa contactezi suportul.');
      }
    }

    async function checkOrder() {
      try {
        const res = await fetch(`${API_BASE}/api/orders/${sessionId}`);
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    async function pollForProvisioning() {
      const maxAttempts = 15;
      for (let i = 0; i < maxAttempts; i++) {
        await new Promise(r => setTimeout(r, 4000));
        
        const order = await checkOrder();
        if (order && order.status === 'provisioned' && order.iccid) {
          showEsimDetails(order);
          return;
        }
        if (order && order.status === 'failed') {
          showError('Activare esuata', order.error || 'eSIM-ul nu a putut fi activat. Contacteaza suportul.');
          return;
        }

        // Update progress
        const progress = Math.min(90, (i + 1) * 7);
        document.getElementById('subtitle').textContent = `Progres: ${progress}%... Te rugam sa astepti`;
      }

      // Timeout
      showError('Timeout', 'Activarea dureaza mai mult decat de obicei. Verifica mai tarziu sau contacteaza suportul.');
    }

    function showEsimDetails(order) {
      updateStatus('success', 'eSIM Activat!', `${escapeHtml(order.countryName) || ''} ${escapeHtml(order.dataLabel) || ''}`);
      
      let html = '<div class="esim-details">';
      
      if (order.iccid) {
        html += `
          <div class="detail-row">
            <span class="detail-label">ICCID</span>
            <span class="detail-value">${escapeHtml(order.iccid)}</span>
          </div>`;
      }
      if (order.planId) {
        html += `
          <div class="detail-row">
            <span class="detail-label">Plan</span>
            <span class="detail-value">${escapeHtml(order.dataLabel || order.planId)}</span>
          </div>`;
      }
      if (order.countryName) {
        html += `
          <div class="detail-row">
            <span class="detail-label">Tara</span>
            <span class="detail-value">${escapeHtml(order.countryName)}</span>
          </div>`;
      }
      html += '</div>';

      // QR Code
      if (order.qrcodeUrl) {
        html += `
          <div class="qr-section">
            <h3>Scaneaza codul QR</h3>
            <img src="${escapeHtml(order.qrcodeUrl)}" alt="eSIM QR Code" />
            <p class="qr-instruction">
              Deschide <strong>Setari > Date mobile > Adauga eSIM</strong> pe iPhone si scaneaza codul QR de mai sus.
            </p>
          </div>`;
      }

      // Apple direct install
      if (order.directAppleInstallUrl) {
        html += `
          <div style="text-align:center; margin-top: 16px;">
            <a href="${escapeHtml(order.directAppleInstallUrl)}" class="apple-install-btn">
              Instaleaza pe iPhone
            </a>
          </div>`;
      }

      // LPA / Activation Code
      if (order.lpa) {
        html += `
          <div class="lpa-section">
            <h4>Cod de activare (LPA)</h4>
            <div class="lpa-code" data-lpa="${escapeHtml(order.lpa)}">${escapeHtml(order.lpa)}</div>
          </div>`;
      }

      // Installation steps
      html += `
        <div class="steps">
          <h3 style="margin-bottom:12px; font-size:1rem;">Cum se instaleaza:</h3>
          <div class="step">
            <div class="step-num">1</div>
            <div class="step-text">Deschide <strong>Setari</strong> pe iPhone/Android</div>
          </div>
          <div class="step">
            <div class="step-num">2</div>
            <div class="step-text">Mergi la <strong>Date mobile / Cellular</strong></div>
          </div>
          <div class="step">
            <div class="step-num">3</div>
            <div class="step-text">Apasa <strong>Adauga eSIM / Add eSIM</strong></div>
          </div>
          <div class="step">
            <div class="step-num">4</div>
            <div class="step-text">Scaneaza codul QR sau introdu codul de activare manual</div>
          </div>
        </div>`;

      document.getElementById('content').innerHTML = html;
      document.getElementById('back-link').style.display = 'inline-block';

      // Attach click handler for LPA copy via data attribute
      const lpaEl = document.querySelector('.lpa-code[data-lpa]');
      if (lpaEl) {
        lpaEl.addEventListener('click', function() {
          copyLpa(this.getAttribute('data-lpa'));
        });
      }
    }

    function updateStatus(type, title, subtitle) {
      const icon = document.getElementById('status-icon');
      icon.className = `icon ${type}`;
      if (type === 'success') {
        icon.innerHTML = '&#10003;';
      } else if (type === 'loading') {
        icon.innerHTML = '<div class="spinner"></div>';
      } else {
        icon.innerHTML = '&#10007;';
      }
      document.getElementById('title').textContent = title;
      document.getElementById('subtitle').textContent = subtitle;
    }

    function showError(title, subtitle) {
      updateStatus('error', title, subtitle);
      document.getElementById('back-link').style.display = 'inline-block';
    }

    function copyLpa(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('copied-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }
  </script>
</body>
</html>
