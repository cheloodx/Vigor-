<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SatConnect - Plata Anulata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #06b6d4;
      --bg-dark: #0f0f23;
      --bg-card: #161632;
      --border: rgba(255,255,255,0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --warning: #f59e0b;
      --radius-md: 12px;
      --radius-xl: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(6,182,212,0.06) 0%, transparent 50%);
    }
    .container {
      max-width: 480px;
      width: 100%;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .nav-mini {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .nav-logo {
      width: 28px; height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
    }
    .nav-name { font-size: 1rem; font-weight: 700; }
    .nav-name span { color: var(--primary-light); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(245,158,11,0.1);
      border: 2px solid rgba(245,158,11,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 28px; height: 28px; color: var(--warning); }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--text-muted); margin-bottom: 28px; line-height: 1.6; font-size: 0.92rem; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: #4f46e5;
      box-shadow: 0 4px 20px rgba(99,102,241,0.3);
      transform: translateY(-1px);
    }
    .back-btn svg { width: 18px; height: 18px; }
    @media (max-width: 480px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="container">
    <div class="nav-mini">
      <div class="nav-logo">S</div>
      <div class="nav-name">Sat<span>Connect</span></div>
    </div>
    <div class="card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <h1>Plata anulata</h1>
      <p>Nu s-a efectuat nicio plata. Poti reveni oricand pentru a cumpara un eSIM.</p>
      <a href="/" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Inapoi la planuri
      </a>
    </div>
  </div>
</body>
</html>
